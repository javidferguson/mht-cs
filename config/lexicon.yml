# Surface form -> canonical entity.
#
# name_must_appear: true marks a NAMED entity - one a member cannot refer to
# without writing its name ("Climara", "ashwagandha", "gabapentin"). A mention of
# such an entity is only accepted if its name or one of its aliases literally
# appears in the source text; unattested ones are flagged and excluded from
# aggregates. The same flag selects which entities the evaluation can measure
# recall on, since their presence is objectively checkable.
#
# Leave it off for DESCRIBED entities - umbrellas ("HRT", "the patch"), activities
# ("exercise", "CBT"), drug classes ("SSRI") and generic forms ("micronized
# progesterone"). Members refer to those without ever naming anything, so
# requiring a literal match would reject correct extractions. Tuned against the OOV report; re-running
# `make normalize` after an edit costs nothing (no model calls).
#
# Matching is: exact normalised alias, then longest whole-word containment.
# Longest-first ordering means a brand always beats its generic class, so
# "Divigel" never collapses into "gel".

